# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: PoseTestBot Documentation
site_description: How to calibrate cameras, record BOP datasets, and evaluate pose estimators with the PoseTestBot operator console
site_url: https://match-cow.github.io/posetestbot/
repo_url: https://github.com/match-cow/PoseTestBot
repo_name: match-cow/PoseTestBot
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

extra_css:
  - stylesheets/technical.css

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Use light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Console tour: guide/console-tour.md
      - Lab safety: guide/lab-safety.md
  - User guide:
      - Calibrate cameras: guide/calibrate-cameras.md
      - Prepare objects and pose templates: guide/objects-and-templates.md
      - Record an object dataset: guide/record-dataset.md
      - Run a pose estimator: guide/pose-estimation.md
      - Evaluate pose accuracy: guide/evaluate-poses.md
      - Evaluate depth quality: guide/evaluate-depth.md
      - Runs, jobs, and your data: guide/runs-jobs-data.md
      - Troubleshooting and FAQ: guide/troubleshooting.md
      - Glossary: guide/glossary.md
  - Technical reference:
      - Overview:
          - System overview: getting-started/overview.md
          - Detailed workflow reference: OPERATOR_WORKFLOWS.md
      - System design:
          - Architecture and boundaries: concepts/architecture.md
          - Runs and artifact lineage: concepts/runs-and-artifacts.md
          - Robot consistency metric: concepts/robot-consistency.md
          - Depth quality and finishes: concepts/depth-evaluation.md
          - Safety and authorization: concepts/safety.md
      - HTTP API:
          - API conventions: reference/http-api.md
          - Complete route index: reference/http-api-routes.md
          - System, sensors, and monitoring: reference/api/system-sensors.md
          - Runs and jobs: reference/api/runs-jobs.md
          - Capture and focused orchestration: reference/api/capture-pipeline.md
          - Calibration: reference/api/calibration.md
          - Workpieces and pose templates: reference/api/catalogs.md
          - BOP and cluster boundary: reference/api/bop-cluster.md
          - Inspect depth evaluation: reference/api/depth-evaluation.md
      - File and command reference:
          - Run configuration: reference/run-config.md
          - Artifact index: reference/artifacts.md
          - CLI and scripts: reference/cli.md
      - Component guides:
          - Calibration target generation: POSEGRIDGEN_CALIBRATION_TARGETS.md
          - Workpiece Catalogue: WORKPIECE_CATALOGUE.md
          - Pose templates and object GT: POSETEMPLATECREATOR_OBJECT_GT.md
  - Lab administration:
      - Setup:
          - Installation and first launch: getting-started/installation.md
          - Physical commissioning: COMMISSIONING.md
      - IIWA integration:
          - Full-capture application: IIWA_FULL_CAPTURE_APPLICATION.md
          - Single-frame static calibration: IIWA_SINGLE_FRAME_STATIC_CAMERA_CALIBRATION.md
          - Nine-frame teaching checklist: IIWA_CALIBRATION_TEACHING_CHECKLIST.md
          - Pose-stream cadence: IIWA_POSE_STREAM_CADENCE.md
      - Maintenance:
          - Documentation maintenance: GITHUB_PAGES.md

copyright: PoseTestBot is research software; physical execution remains operator-controlled.
