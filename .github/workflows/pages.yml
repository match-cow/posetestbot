name: Deploy documentation site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "iiwa/calibration_teaching_plan.v2.json"
      - "mkdocs.yml"
      - "posetestbot/calibration/teaching_plan.py"
      - "posetestbot/web/app.py"
      - "posetestbot/web/routes/**"
      - "scripts/generate_http_api_reference.py"
      - "scripts/plot_iiwa_calibration_teaching_plan.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Check generated teaching plot
        env:
          MPLCONFIGDIR: /tmp/posetestbot-mpl
        run: uv run --frozen --no-default-groups --group docs python scripts/plot_iiwa_calibration_teaching_plan.py --check

      - name: Check generated HTTP route index
        run: uv run --frozen --no-default-groups --group docs python scripts/generate_http_api_reference.py --check

      - name: Build technical documentation
        run: uv run --frozen --no-default-groups --group docs mkdocs build --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
